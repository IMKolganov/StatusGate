services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-statusgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statusgate}
      POSTGRES_DB: ${POSTGRES_DB:-statusgate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statusgate} -d ${POSTGRES_DB:-statusgate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      # Required for persistent OpenVPN: ip netns add mounts /run/netns
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-statusgate}:${POSTGRES_PASSWORD:-statusgate}@db:5432/${POSTGRES_DB:-statusgate}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-5/minute}
      DEFAULT_POLL_INTERVAL_SECONDS: ${DEFAULT_POLL_INTERVAL_SECONDS:-60}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEFAULT_SPEED_TEST_URL_TEMPLATE: ${DEFAULT_SPEED_TEST_URL_TEMPLATE:-https://speed.cloudflare.com/__down?bytes={bytes}}
      CLOUDFLARE_SPEED_TEST_ORIGIN: ${CLOUDFLARE_SPEED_TEST_ORIGIN:-https://speed.cloudflare.com}
      DEFAULT_PROBE_URL: ${DEFAULT_PROBE_URL:-https://ifconfig.me/ip}
      GOOGLE_PROBE_URL: ${GOOGLE_PROBE_URL:-https://www.gstatic.com/generate_204}
      INTERNET_PING_HOST: ${INTERNET_PING_HOST:-8.8.8.8}
      VPN_NETNS_DNS_SERVERS: ${VPN_NETNS_DNS_SERVERS:-1.1.1.1,8.8.8.8}
      HOST_WAN_BASELINE_PATH: ${HOST_WAN_BASELINE_PATH:-/var/lib/statusgate/host_wan_baseline.json}
    volumes:
      - statusgate_data:/var/lib/statusgate
    depends_on:
      db:
        condition: service_healthy

  # One-shot pytest against statusgate_test (does not start with normal `up`).
  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      JWT_SECRET: ${JWT_SECRET:-compose-test-jwt-secret-at-least-32-characters}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-statusgate}:${POSTGRES_PASSWORD:-statusgate}@db:5432/statusgate_test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-statusgate}:${POSTGRES_PASSWORD:-statusgate}@db:5432/statusgate_test
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      # Required for persistent OpenVPN: ip netns add mounts /run/netns
      - SYS_ADMIN
    # Docker's default AppArmor profile denies mount; without this, ip netns fails
    # with "mount --make-shared /run/netns failed: Permission denied".
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    command: sh -c "alembic upgrade head && python -m app.worker"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-statusgate}:${POSTGRES_PASSWORD:-statusgate}@db:5432/${POSTGRES_DB:-statusgate}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEFAULT_POLL_INTERVAL_SECONDS: ${DEFAULT_POLL_INTERVAL_SECONDS:-60}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-30}
      DEFAULT_SPEED_TEST_URL_TEMPLATE: ${DEFAULT_SPEED_TEST_URL_TEMPLATE:-https://speed.cloudflare.com/__down?bytes={bytes}}
      CLOUDFLARE_SPEED_TEST_ORIGIN: ${CLOUDFLARE_SPEED_TEST_ORIGIN:-https://speed.cloudflare.com}
      DEFAULT_PROBE_URL: ${DEFAULT_PROBE_URL:-https://ifconfig.me/ip}
      GOOGLE_PROBE_URL: ${GOOGLE_PROBE_URL:-https://www.gstatic.com/generate_204}
      INTERNET_PING_HOST: ${INTERNET_PING_HOST:-8.8.8.8}
      VPN_NETNS_DNS_SERVERS: ${VPN_NETNS_DNS_SERVERS:-1.1.1.1,8.8.8.8}
      HOST_WAN_BASELINE_PATH: ${HOST_WAN_BASELINE_PATH:-/var/lib/statusgate/host_wan_baseline.json}
    volumes:
      - statusgate_data:/var/lib/statusgate
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        RUN_TESTS: ${RUN_TESTS:-1}
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-StatusGate}
        VITE_BRAND_LOGO_URL: ${VITE_BRAND_LOGO_URL:-}
        VITE_BRAND_LOGO_URL_LIGHT: ${VITE_BRAND_LOGO_URL_LIGHT:-}
        VITE_BRAND_LOGO_URL_DARK: ${VITE_BRAND_LOGO_URL_DARK:-}
        VITE_BRAND_TAGLINE: ${VITE_BRAND_TAGLINE:-Service status monitoring}
        VITE_DEFAULT_SPEED_TEST_URL_TEMPLATE: ${VITE_DEFAULT_SPEED_TEST_URL_TEMPLATE:-}
        VITE_CLOUDFLARE_SPEED_TEST_ORIGIN: ${VITE_CLOUDFLARE_SPEED_TEST_ORIGIN:-}
        VITE_DEFAULT_PROBE_URL: ${VITE_DEFAULT_PROBE_URL:-}
        VITE_INTERNET_PING_HOST: ${VITE_INTERNET_PING_HOST:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_UPSTREAM: backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  statusgate_data:
